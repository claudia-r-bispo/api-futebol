spring.application.name=partidaFutebol# Configurações do H2spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXLLEGACY_DATETIME=TRUE;DATABASE_TO_UPPER=FALSEspring.datasource.driver-class-name=org.h2.Driverspring.datasource.username=saspring.datasource.password=spring.jpa.hibernate.ddl-auto=updatespring.jpa.database-platform=org.hibernate.dialect.H2Dialectspring.jpa.show-sql=truespring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialectspring.jpa.properties.hibernate.format_sql=true# Habilita o suporte a UUID no H2spring.jpa.properties.hibernate.id.uuid_representation=BINARYspring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo# Configurações do H2 Consolespring.h2.console.enabled=truespring.h2.console.path=/h2-console# Configurações do RabbitMQspring.rabbitmq.host=localhostspring.rabbitmq.port=5672spring.rabbitmq.username=clrspring.rabbitmq.password=user1234spring.rabbitmq.listener.direct.retry.enabled=truespring.rabbitmq.listener.direct.retry.max-attempts=3spring.rabbitmq.listener.direct.default-requeue-rejected=false# Configurações adicionais de reconexãospring.rabbitmq.connection-timeout=5000spring.rabbitmq.template.retry.enabled=truespring.rabbitmq.template.retry.initial-interval=1000spring.rabbitmq.template.retry.max-attempts=3spring.rabbitmq.template.retry.max-interval=10000spring.rabbitmq.template.retry.multiplier=2.0#spring.datasource.url=jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE#spring.datasource.driver-class-name=org.h2.Driver#spring.datasource.username=sa#spring.datasource.password=#spring.jpa.hibernate.ddl-auto=create-drop#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect###spring.jpa.show-sql=true